alias loadoutA_cfg 
alias loadoutB_cfg 
alias loadoutC_cfg 
alias loadoutD_cfg 
exec loadouts/medic

-attack

exec binds
bind w "+nmov_forward"
viewmodel_fov 90

//MEDIC CFG
alias fake_msg "say_team *** FAKE FAKE FAKE ***"
alias fake "voicemenu 1 7; fake_msg"
alias "weapon" "bind MOUSE1 +attack"
alias "medigun" "bind MOUSE1 +heal"
alias +heal "-attack; spec_next"
alias -heal "+attack"
alias uber_msg "say_team *** USED USED USED ***
alias +uber "dropitem; +attack2; voicemenu 2 3; spec_prev;uber_msg"
alias -uber "-attack2;"
alias mask_msg "say_team *** MASKED MASKED MASKED ***"
alias mask "voicemenu 2 3;mask_msg"

//WEAPONS
bind "1" "slot1; r_drawviewmodel 1; weapon; -attack"
bind "2" "slot2; r_drawviewmodel 1; medigun; +attack"
bind "3" "slot3; r_drawviewmodel 1; weapon; -attack"

//ACTIONS
bind "MOUSE1" "+attack"
bind "MOUSE2" "+uber"
bind "f" "fake"
bind "z" "mask"
bind "x" "mask"
bind "c" "mask"