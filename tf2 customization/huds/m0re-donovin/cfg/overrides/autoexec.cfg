//null canceling movement 
alias null ""
alias +nmov_forward "-back   ; +forward; alias nmov_reforward +forward"
alias +nmov_back    "-forward; +back   ; alias nmov_reback    +back"
alias -nmov_forward "-forward; nmov_reback   ; alias nmov_reforward null"
alias -nmov_back    "-back   ; nmov_reforward; alias nmov_reback    null"
alias +nmov_moveleft  "-moveright; +moveleft ; alias nmov_removeleft  +moveleft"
alias +nmov_moveright "-moveleft ; +moveright; alias nmov_removeright +moveright"
alias -nmov_moveleft  "-moveleft ; nmov_removeright; alias nmov_removeleft  null"
alias -nmov_moveright "-moveright; nmov_removeleft ; alias nmov_removeright null"
alias nmov_reforward null
alias nmov_reback    null
alias nmov_removeleft  null
alias nmov_removeright null
alias uberpanel "showpanel specgui"
bind w "+nmov_forward"
bind s "+nmov_back"
bind a "+nmov_moveleft"
bind d "+nmov_moveright"


//tab-graph
alias +tabgraph "+showscores; net_graph 1"
alias -tabgraph "-showscores; net_graph 0; timeleft"
bind tab +tabgraph



//confilter idk if this even works lol
con_filter_enable 1
con_filter_text_out "Error"



//loadout binds
exec loadouts/load
bind uparrow loadoutA
bind leftarrow loadoutB
bind downarrow loadoutC
bind rightarrow loadoutD



//cj script
alias +rj "spec_mode;-duck;+cr;alias checkrj +cr";
alias -rj "-cr;checkduck;alias checkrj none";
alias +crouch "-cr;+duck;alias checkduck +duck";
alias -crouch "-duck;checkrj;alias checkduck none";
alias checkduck none;
alias checkrj none;
alias +cr "+jump;+duck";
alias -cr "-duck;-jump";
alias none "";
bind space +rj;
bind ctrl +crouch;



//random binds
bind mwheelup "resup"
bind mwheeldown "+jump"
bind "CAPSLOCK" "min"
bind del "say eat up"
bind "ins" "say [9:49 PM] sin_k4rma_6s_demon: your move"
bind "/" "say sin_k4rma_6s_demon: aww nt buddy"
bind "pgup" "say @_@"
bind "pgdn" "say ( ̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿°̿ ̿ ̿ ̿ ̿ ̿ ̿ ̿ ͜ʖ ̿ ̿ ̿ ̿ ̿ ̿ ̿°̿ ̿ ̿ ̿ ̿ ̿ ̿ )"
bind [ "say ʸᵉᵃʰ"
bind ] "say ᴸᴼᴸ"
bind "\" "ds_mark"
alias "q" "quit"
alias "dc" "disconnect"



//misc 
r_drawtracers_firstperson 1
cl_spec_carrieditems
motion_blur_off
map_background preload_room; wait 10; disconnect
sv_cheats 1
sv_allow_point_servercommand always
cl_resend 1.5
alias "fix" "record demo;stop;ds_record"
bind ' fix
cl_jiggle_bone_framerate_cutoff 1
tf_dingaling_volume 1
hud_saytext_time 1
cl_showtextmsg 1
cl_showpluginmessages 1
cl_chatfilters 63
alias soundfix "snd_soundmixer Default_Mix"



//crosshair & etc
alias "min" "toggle tf_use_min_viewmodels"
alias "viewm" "toggle r_drawviewmodel"
alias "viewmodel" "toggle r_drawviewmodel"
alias "54" "viewmodel_fov 54"
alias "60" "viewmodel_fov 60"
alias "70" "viewmodel_fov 70"
alias "80" "viewmodel_fov 80"
alias "90" "viewmodel_fov 90"
alias "100" "viewmodel_fov 100"
alias "110" "viewmodel_fov 110"
alias "120" "viewmodel_fov 120"
alias "red" "hud_combattext_red 255"
alias "nored" "hud_combattext_red 0"
alias "blue" "hud_combattext_blue 255"
alias "noblue" "hud_combattext_blue 0"
alias "green" "hud_combattext_green 255"
alias "nogreen" "hud_combattext_green 0"
alias bumbo "tf_dingaling_pitchmaxdmg 40;tf_dingaling_pitchmindmg 120"
alias "killsound" "toggle tf_dingalingaling_lasthit"




