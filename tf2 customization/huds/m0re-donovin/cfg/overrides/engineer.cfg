exec loadouts/engineer

-attack

exec binds

viewmodel_fov 80

//Build Menu
alias buildsentry "build 2";
alias builddispenser "build 0";
alias buildentry "build 1";
alias buildexit "build 3";

//Destroy Menu
alias destroysentry "destroy 2";
alias destroydispenser "destroy 0";
alias destroyentry "destroy 1";
alias destroyexit "destroy 3";

bind "mouse5" "destroysentry;buildsentry";
bind "mouse4" "destroydispenser;builddispenser";
bind "z" "destroyentry;buildentry";
bind "x" "destroyentry;buildentry";
bind "c" "destroyentry;buildentry";
bind "f" "destroyexit;buildexit";